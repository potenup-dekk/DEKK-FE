name: DEKK FE Deploy (develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t next-develop-app .

      - name: Deploy with Docker
        run: |
          docker stop next-develop-container || true
          docker rm next-develop-container || true

          docker run -d --name next-develop-container -p 3000:3000 --restart unless-stopped next-develop-app
